spring.application.name=springboot-backend-linkoria

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/linkoria?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.address=0.0.0.0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

#codigo secreto para desarrollo TODO: cambiarlo cuando este en produccion
app.jwt.secret=${JWT_SECRET:tu_secret_local}